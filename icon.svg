<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9933;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="centerGlow">
      <stop offset="0%" style="stop-color:#FF8000;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF8000;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Main background circle -->
  <circle cx="512" cy="512" r="480" fill="url(#bgGradient)"/>
  
  <!-- Concentric hexagonal pattern -->
  <g transform="translate(512, 512)" stroke-width="3" fill="none">
    <!-- Outer hexagon ring -->
    <polygon points="0,-280 242,-140 242,140 0,280 -242,140 -242,-140" 
             stroke="#FF8000" opacity="0.3"/>
    
    <!-- Second hexagon ring -->
    <polygon points="0,-210 182,-105 182,105 0,210 -182,105 -182,-105" 
             stroke="#FF9933" opacity="0.4"/>
    
    <!-- Third hexagon ring -->
    <polygon points="0,-140 121,-70 121,70 0,140 -121,70 -121,-70" 
             stroke="#FFB84D" opacity="0.5"/>
    
    <!-- Inner hexagon ring -->
    <polygon points="0,-70 61,-35 61,35 0,70 -61,35 -61,-35" 
             stroke="#FFCC66" opacity="0.6"/>
    
    <!-- Connecting lines creating web pattern -->
    <line x1="0" y1="-280" x2="0" y2="-70" stroke="#FF8000" opacity="0.2"/>
    <line x1="242" y1="-140" x2="61" y2="-35" stroke="#FF8000" opacity="0.2"/>
    <line x1="242" y1="140" x2="61" y2="35" stroke="#FF8000" opacity="0.2"/>
    <line x1="0" y1="280" x2="0" y2="70" stroke="#FF8000" opacity="0.2"/>
    <line x1="-242" y1="140" x2="-61" y2="35" stroke="#FF8000" opacity="0.2"/>
    <line x1="-242" y1="-140" x2="-61" y2="-35" stroke="#FF8000" opacity="0.2"/>
    
    <!-- Diagonal cross lines -->
    <line x1="-200" y1="-200" x2="200" y2="200" stroke="#FF8000" opacity="0.15"/>
    <line x1="200" y1="-200" x2="-200" y2="200" stroke="#FF8000" opacity="0.15"/>
    
    <!-- Center glow circle -->
    <circle cx="0" cy="0" r="150" fill="url(#centerGlow)"/>
    
    <!-- Center solid circle -->
    <circle cx="0" cy="0" r="50" fill="url(#orangeGlow)"/>
    
    <!-- Small accent circles at hexagon vertices -->
    <circle cx="0" cy="-210" r="8" fill="#FF9933" opacity="0.8"/>
    <circle cx="182" cy="-105" r="8" fill="#FF9933" opacity="0.8"/>
    <circle cx="182" cy="105" r="8" fill="#FF9933" opacity="0.8"/>
    <circle cx="0" cy="210" r="8" fill="#FF9933" opacity="0.8"/>
    <circle cx="-182" cy="105" r="8" fill="#FF9933" opacity="0.8"/>
    <circle cx="-182" cy="-105" r="8" fill="#FF9933" opacity="0.8"/>
  </g>
  
  <!-- Outer border -->
  <circle cx="512" cy="512" r="480" fill="none" stroke="#FF8000" stroke-width="2" opacity="0.4"/>
</svg>
